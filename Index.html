
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDCommunity</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101426;
      color: white;
      text-align: center;
    }
    header {
      padding: 55px 20px;
      background: linear-gradient(135deg, #5425b8, #087fbd);
    }
    h1 { font-size: 42px; margin: 0; }
    main { padding: 35px 20px; }
    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 15px;
      background: #202943;
    }
  </style>
</head>
<body>
  <header>
    <h1>GDCommunity</h1>
    <p>A comunidade brasileira de Geometry Dash!</p>
  </header>

  <main>
    <div class="card">
      <h2>Bem-vindo!</h2>
      <p>Nosso espaço para jogadores, criadores de fases e fãs de Geometry Dash.</p>
      <p>Estamos começando!</p>
    </div>
  </main>
</body>
</html>
